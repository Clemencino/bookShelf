<div class="book">
    <div class="placeholder" [routerLink]="['/book', book.id]">
        <img id="bookimg"[src]="book.urlImage"/>

        <div class="book-title">
            {{ book.name }}
        </div>
        
    </div>
    <div class="book-detail">
            <div class="book-title-detail">
                {{ book.name }}
            </div>
            <div class="book-description">
                {{ book.description }}
            </div>
        </div>
</div>
