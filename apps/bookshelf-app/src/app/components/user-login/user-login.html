<div class="form">
    <img src="/assets/user.png" width="150px" style="padding-top: 100px;">

    <h1>User Connection</h1>
    <div class="form-field-name">
        email:
        <input [(ngModel)]="login"/>
    </div>

    <div class="form-field-url">
        password:
        <input [(ngModel)]="password" type="password">
    </div>
    
    <div class = "incorrectLogin">
        @if (!isCorrect) {
            *login or password incorrect
        }
    </div>
    <div class ="noAccount">
        <a href="url" routerLink="/userCreateAccount">Create account</a>
    </div>
    <div class="form-buttons">
        <button class="cancel" (click)="cancel()">Cancel</button>
        <button class="submit" (click)="submit()">Submit</button>
    </div>
