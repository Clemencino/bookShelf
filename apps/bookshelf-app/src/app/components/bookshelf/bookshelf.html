<div class = "container">
    <div class="placeholder" [routerLink]="['/userLogin']">
        <img class="userProfile" src="assets/user.png"/>
        <H1>Library</H1>
    </div>
            


    <div class="placeholder">

        <div class="book-infos">
            {{ bookshelf.length }} books collected
        </div>

        <div>
            <div class = "books">
                @for (item of bookshelf; track item.name){
                    <app-book [book] =item/>
                }
            </div>
        </div>

        <div class="addButton">
            <button class="add" routerLink="/addBook">+ Add Book</button>
        </div>

    </div>
</div>
